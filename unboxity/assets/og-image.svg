<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5A623"/>
      <stop offset="0.5" stop-color="#D97706"/>
      <stop offset="1" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Soft decorative blobs -->
  <circle cx="1000" cy="100" r="240" fill="white" fill-opacity="0.06"/>
  <circle cx="100" cy="560" r="200" fill="white" fill-opacity="0.06"/>

  <!-- Logo card -->
  <g transform="translate(110, 165)">
    <rect width="300" height="300" rx="60" fill="white" fill-opacity="0.16"/>
    <g transform="translate(150, 175)">
      <!-- Isometric box -->
      <path d="M-90 -40 L0 -90 L90 -40 L0 10 Z" fill="white" fill-opacity="0.98"/>
      <path d="M-90 -40 L-90 70 L0 120 L0 10 Z" fill="white" fill-opacity="0.72"/>
      <path d="M90 -40 L90 70 L0 120 L0 10 Z" fill="white" fill-opacity="0.86"/>
    </g>
    <!-- AI sparkle -->
    <path d="M240 65 L246 79 L260 85 L246 91 L240 105 L234 91 L220 85 L234 79 Z" fill="white"/>
  </g>

  <!-- Text -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="white">
    <text x="460" y="295" font-size="110" font-weight="800" letter-spacing="-3">Unboxity</text>
    <text x="460" y="365" font-size="38" font-weight="600" fill-opacity="0.96">Smart Box Inventory with AI</text>
    <text x="460" y="420" font-size="26" font-weight="400" fill-opacity="0.82">Photograph · AI identifies items · QR labels · Find instantly</text>
    <text x="460" y="540" font-size="22" font-weight="500" fill-opacity="0.7">unboxity.fiftify.com  ·  by Fiftify Inc.</text>
  </g>
</svg>
